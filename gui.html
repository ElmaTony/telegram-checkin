<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Telegram 签到 · 工作台</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m21 3-6.5 18-4-7.5L3 9.5 21 3Z M21 3 10.5 13.5"/></svg></span><span>Telegram 签到<small>CHECK-IN WORKSPACE</small></span></a>
      <div class="nav-caption">控制中心</div>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-footer"><span class="connection-dot" aria-hidden="true"></span><span id="connection" aria-live="polite">正在连接服务</span><small>每天定时 · 微信汇总</small></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">个人工作区 <span>/</span> <strong id="breadcrumb">签到工作台</strong></div><div class="topbar-actions"><span id="draft-indicator" hidden>配置有未保存修改</span><label class="theme-label"><span class="sr-only">外观</span><select id="theme" aria-label="外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></div></header>
      <div id="job-banner" class="job-banner" hidden aria-live="polite"></div>
      <main id="main" aria-label="控制台内容"><div class="empty-state">正在读取账号与签到结果…</div></main>
      <footer class="page-footer"><span>数据与登录会话保存在运行服务的设备</span><span id="last-update"></span></footer>
    </div>
  </div>
  <dialog id="modal" aria-label="操作窗口"></dialog>
  <dialog id="chooser" aria-label="选择 Telegram 会话"></dialog>
  <dialog id="token-dialog" aria-labelledby="token-heading"><form id="token-form"><h2 id="token-heading">连接本地工作台</h2><p class="muted">此工作台设置了访问令牌。输入后继续。</p><label class="field">访问令牌<input id="token-input" type="password" autocomplete="off" required></label><div class="dialog-actions"><button class="primary" type="submit">连接</button></div></form></dialog>
  <div id="notifications" class="notifications" role="status" aria-live="polite" popover="manual"></div>
</body>
</html>
